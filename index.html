<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="ラップと累積時間を記録できる、オフライン対応ストップウォッチ。">
<meta name="application-name" content="ストップウォッチ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ストップウォッチ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>ストップウォッチ</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<noscript class="noscript">ストップウォッチを使うにはJavaScriptを有効にしてください。</noscript>
<main class="stopwatch" data-state="ready" aria-label="ストップウォッチ">
    <button id="exportButton" class="export-button" type="button" disabled
        aria-label="ラップ一覧を画像で保存" title="ラップ一覧を画像で保存">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/>
        </svg>
    </button>
    <div class="timer-face">
        <div id="display" class="display" role="timer" aria-label="経過時間">00:00.00</div>
    </div>

    <div class="buttons">
        <button id="leftButton" type="button">ラップ</button>
        <button id="rightButton" type="button">開始</button>
    </div>

    <section class="laps-panel" aria-label="ラップ一覧">
        <div class="laps">
            <div id="lapHeader" class="lap-header" hidden>
                <span>ラップ</span>
                <span>累積時間</span>
                <span>ラップタイム</span>
            </div>
            <div id="lapList"></div>
        </div>
    </section>
</main>

<dialog id="exportDialog" class="export-dialog" aria-labelledby="exportTitle" aria-describedby="exportStatus">
    <div class="export-dialog-content">
        <header class="export-dialog-header">
            <h2 id="exportTitle">ラップ画像</h2>
            <button id="closeExport" class="export-action export-close" type="button" autofocus>閉じる</button>
        </header>
        <p id="exportStatus" class="export-status" role="status" aria-live="polite"></p>
        <div id="exportImages" class="export-images"></div>
        <footer class="export-dialog-footer">
            <button id="shareExport" class="export-action" type="button" disabled>共有・保存</button>
        </footer>
    </div>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
