<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="ラップと累積時間を記録できる、オフライン対応ストップウォッチ。">
<meta name="application-name" content="ストップウォッチ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ストップウォッチ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>ストップウォッチ</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<noscript class="noscript">ストップウォッチを使うにはJavaScriptを有効にしてください。</noscript>
<main class="stopwatch" data-state="ready" aria-label="ストップウォッチ">
    <div class="timer-face">
        <div id="display" class="display" role="timer" aria-label="経過時間">00:00.00</div>
    </div>

    <div class="buttons">
        <button id="leftButton" type="button">ラップ</button>
        <button id="rightButton" type="button">開始</button>
    </div>

    <section class="laps-panel" aria-label="ラップ一覧">
        <div class="laps">
            <div id="lapHeader" class="lap-header" hidden>
                <span>ラップ</span>
                <span>累積時間</span>
                <span>ラップタイム</span>
            </div>
            <div id="lapList"></div>
        </div>
    </section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
